<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벽란도 무역항 · 모둠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4ECDC;--ink:#23303B;--muted:#6E6556;--panel:#FFFCF5;--line:#E3D5BA;--sea:#1D4E6B;--sea2:#2E7A9A;--celadon:#5E9C8F;--red:#B5432D;--gold:#C9962B;--ok:#2E8B57;--warn:#D65A31;--tc:#888}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--tc) 16%,transparent) 0,transparent 45%),var(--bg)}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit;touch-action:manipulation}
#app{height:100dvh;min-height:600px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px 12px 10px}
.head{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:6px 12px;box-shadow:0 3px 0 var(--line);border-left:12px solid var(--tc);min-height:64px}
.head .tn{font:clamp(26px,3.4vw,38px)/1 "Jua",sans-serif;color:var(--tc);white-space:nowrap}
.head .pct{font:clamp(20px,2.6vw,28px) "Jua",sans-serif;background:#F1E8D6;border-radius:999px;padding:.15em .7em;white-space:nowrap}
.head .pct.done{background:var(--ok);color:#fff}
.head .mid{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:.2em .9em;font:clamp(18px,2.3vw,26px) "Jua",sans-serif;white-space:nowrap}
.pill.r1,.pill.r2{background:var(--sea2)}.pill.event{background:var(--gold)}.pill.end{background:var(--red)}
.clock{font:clamp(28px,3.6vw,42px)/1 "Jua",sans-serif;font-variant-numeric:tabular-nums;min-width:3.1em;text-align:center;padding:4px 8px;border-radius:12px;background:#F1E8D6}
.clock.hot{background:var(--warn);color:#fff;animation:pulse .8s infinite}.clock.off{background:var(--ink);color:#fff}
@keyframes pulse{50%{transform:scale(1.06)}}
.chg{font-size:13px;color:var(--muted);text-decoration:underline;padding:6px 2px;white-space:nowrap}
.badge{border-radius:999px;padding:.3em .7em;font-size:13px;background:#FFF1C9;color:#7A5A00;display:none;white-space:nowrap}.badge.on{display:block}.badge.err{background:#FFE0D6;color:#A63A20}
.view{display:none;min-height:0}.view.on{display:grid}
.center{place-items:center;text-align:center}
h2.big{font:clamp(32px,5vw,56px)/1.15 "Jua",sans-serif}
.waitbox{background:var(--panel);border-radius:24px;padding:22px 28px;box-shadow:0 4px 0 var(--line);max-width:640px;font-size:clamp(18px,2.2vw,24px);line-height:1.6;color:var(--muted);margin-top:14px}
.spin{display:inline-block;width:.9em;height:.9em;border:4px solid var(--line);border-top-color:var(--sea2);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* game */
#vGame{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--panel);border-radius:18px;padding:8px 12px 10px;box-shadow:0 3px 0 var(--line);min-height:0;display:flex;flex-direction:column;gap:6px}
.box h3{font:clamp(19px,2.3vw,25px) "Jua",sans-serif;color:var(--sea);display:flex;align-items:baseline;gap:8px}
.box h3 small{font:clamp(13px,1.5vw,16px) "Gowun Dodum";color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,11vw,128px),1fr));gap:6px;overflow:auto;min-height:0}
.item{position:relative;border-radius:14px;background:#F6EFE1;border:3px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:clamp(62px,9vh,84px)}
.item .e{font-size:clamp(22px,2.8vw,30px);line-height:1.1;margin-bottom:2px}
.item .n{font:clamp(17px,2.1vw,22px)/1.1 "Jua",sans-serif}
.item .q{font:clamp(19px,2.4vw,26px)/1 "Jua",sans-serif;font-variant-numeric:tabular-nums}
.order .item{border-style:dashed}
.order .item.ok{background:#E1F2E7;border:3px solid #7FC196}.order .item.ok::after{content:"✓";position:absolute;right:5px;top:1px;font:22px "Jua",sans-serif;color:var(--ok)}
.order .item.new{border-color:var(--gold);box-shadow:0 0 0 3px #FFE08A}
.inv .item{background:#fff}
.inv .item .tag{position:absolute;left:3px;top:2px;font-size:11px;background:#FFE0D6;color:var(--red);border-radius:999px;padding:0 5px}
.inv .item.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.12);border-color:var(--ok)}}
.bigbtn{height:clamp(74px,12vh,96px);border-radius:20px;background:var(--sea);color:#fff;font:clamp(28px,3.6vw,40px) "Jua",sans-serif;box-shadow:0 5px 0 #123447;flex:none}
.bigbtn:active:not(:disabled){transform:translateY(4px);box-shadow:none}.bigbtn:disabled{background:#B9AE99;box-shadow:none}
.bigbtn small{display:block;font:clamp(14px,1.7vw,17px) "Gowun Dodum";opacity:.9}
.closed{background:#EFE6D4;border-radius:14px;padding:8px 12px;font:clamp(16px,2vw,20px) "Jua",sans-serif;color:var(--muted);text-align:center}
.out{border:3px solid var(--sea2)}.out .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.out .txt{flex:1;font:clamp(16px,2vw,20px)/1.4 "Jua",sans-serif}
.sm{height:44px;padding:0 14px;border-radius:12px;background:#EFE6D4;font:18px "Jua",sans-serif;white-space:nowrap}.sm.warn{background:var(--warn);color:#fff}
.chip{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:999px;background:#F3EADA;border:2px solid var(--line);font:clamp(16px,2vw,20px)/1.2 "Jua",sans-serif;white-space:nowrap}
.arab{border:3px solid var(--gold);background:linear-gradient(180deg,#FFF8E3,#FFFCF5)}
.arab h3{color:#8A6212}
.abuy{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;overflow:auto}
.abuy .g{font:clamp(18px,2.2vw,22px)/1.15 "Jua",sans-serif}.abuy .g small{color:var(--muted);font-size:.75em}
.abuy .bs{display:flex;gap:6px;justify-content:flex-end}
.abuy button{height:46px;padding:0 9px;border-radius:12px;background:var(--gold);color:#fff;font:clamp(15px,1.9vw,19px) "Jua",sans-serif;box-shadow:0 3px 0 #8F6A18;white-space:nowrap}
.abuy button:disabled{background:#D9CFBC;box-shadow:none}
.mylog{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.mylog div{font:clamp(14px,1.7vw,17px)/1.35 "Jua",sans-serif;background:#F6EFE1;border-radius:10px;padding:4px 8px}
/* overlay: composer / incoming / event */
.ov{position:fixed;inset:0;z-index:40;display:none;background:rgba(25,35,45,.55);padding:10px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ov.on{display:flex}
.ov.on>*{margin:auto}   /* 화면보다 크면 위에서부터 스크롤, 작으면 가운데 */
.sheet{background:var(--panel);border-radius:24px;width:min(1180px,100%);min-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:10px 14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet header{display:flex;align-items:center;gap:10px}.sheet header h3{font:clamp(24px,3vw,32px) "Jua",sans-serif;margin-right:auto}
.partners{display:flex;gap:6px;flex-wrap:wrap}
.pbtn{height:clamp(52px,8vh,64px);padding:0 12px;border-radius:14px;background:#fff;border:4px solid var(--pc);color:var(--pc);font:clamp(19px,2.4vw,26px) "Jua",sans-serif;box-shadow:0 3px 0 var(--pc)}
.pbtn.on{background:var(--pc);color:#fff}
.pbtn.lock{opacity:.4;border-style:dashed;box-shadow:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0}
.side{background:#F7F1E4;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:0}
.side h4{font:clamp(19px,2.4vw,25px) "Jua",sans-serif;text-align:center}.side.give h4{color:var(--red)}.side.take h4{color:var(--ok)}
.rows{display:flex;flex-direction:column;gap:5px}
.qrow{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:4px 6px;border:3px solid transparent}
.qrow.sel{border-color:var(--sea2)}
.qrow .nm{flex:1;font:clamp(18px,2.3vw,24px) "Jua",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qrow .nm small{font-size:.65em;color:var(--muted)}.qrow .nm .need{color:var(--red)}
.qrow button{width:clamp(44px,5.6vw,56px);height:clamp(44px,5.6vw,56px);border-radius:12px;background:#EFE6D4;font:30px/1 "Jua",sans-serif}
.qrow button.plus{background:var(--sea2);color:#fff}
.qrow button:disabled{opacity:.3}
.qrow b{min-width:1.6em;text-align:center;font:clamp(24px,3vw,32px) "Jua",sans-serif}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:clamp(16px,2vw,20px)}
.sheet footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:-10px;background:var(--panel);padding:8px 0 10px;border-top:2px solid var(--line);z-index:2}
.sum{flex:1;font:clamp(17px,2.1vw,22px)/1.4 "Jua",sans-serif}.sum .warnline{color:var(--red);font-size:.85em}
.send{height:clamp(60px,9vh,74px);padding:0 26px;border-radius:18px;background:var(--ok);color:#fff;font:clamp(22px,2.8vw,30px) "Jua",sans-serif;box-shadow:0 4px 0 #1C6340;white-space:nowrap}.send:disabled{opacity:.35;box-shadow:none}
.modal{background:var(--panel);border-radius:26px;width:min(720px,96vw);padding:16px 20px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border-top:14px solid var(--pc);animation:popin .3s}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.modal h3{font:clamp(26px,3.6vw,38px)/1.2 "Jua",sans-serif;color:var(--pc)}
.modal .more{font-size:17px;color:var(--muted);margin-top:2px}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.deal div{background:#F7F1E4;border-radius:16px;padding:10px}.deal h4{font:clamp(18px,2.2vw,22px) "Jua",sans-serif;margin-bottom:6px}
.deal .get h4{color:var(--ok)}.deal .pay h4{color:var(--red)}
.deal .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.deal .chip{font-size:clamp(20px,2.6vw,28px);padding:4px 12px}
.modal .warnline{color:var(--red);font:18px "Jua",sans-serif;margin-bottom:8px}
.modal .btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.modal .btns button{height:clamp(60px,9vh,76px);border-radius:18px;font:clamp(22px,3vw,32px) "Jua",sans-serif}
.modal.locked .btns button{opacity:.45}
.modal .no{background:#EFE6D4}.modal .yes{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1C6340}
.evbox{background:linear-gradient(180deg,#0E2F47,#2E86A8);color:#fff;border-radius:28px;width:min(760px,96vw);padding:22px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.evbox .ship{font-size:90px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-5deg)}}
.evbox h3{font:clamp(34px,5vw,54px) "Jua",sans-serif;color:#FFE08A}
.evbox p{font-size:clamp(18px,2.3vw,24px);line-height:1.5;margin:8px 0}
.evbox .chip{font-size:24px;color:var(--ink)}
.evbox button{margin-top:10px;height:60px;padding:0 30px;border-radius:16px;background:#FFE08A;color:#4A3500;font:26px "Jua",sans-serif}
/* end */
#vEnd{place-items:center;overflow:auto}
.endcard{display:flex;flex-direction:column;gap:10px;align-items:center;width:min(820px,100%)}
.endcard .score{font:clamp(44px,7vw,80px)/1 "Jua",sans-serif;color:var(--tc)}
.endcard .bonus{background:#FFE08A;border-radius:16px;padding:8px 16px;font:clamp(20px,2.6vw,28px) "Jua",sans-serif}
.endcard .bonus.no{background:#EFE6D4;color:var(--muted)}
.rank{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.rank div{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:6px 12px;font:clamp(18px,2.3vw,24px) "Jua",sans-serif;color:var(--pc);box-shadow:0 2px 0 var(--line)}
.rank div.me{outline:4px solid var(--pc)}.rank div b{margin-left:auto;color:var(--ink)}
.toast{position:fixed;left:50%;top:10px;transform:translate(-50%,-30px);background:var(--ink);color:#fff;border-radius:999px;padding:.6em 1.3em;font-size:clamp(17px,2.1vw,22px);opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:94vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#A63A20}.toast.win{background:var(--ok)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (orientation:portrait),(max-width:760px){#app{height:auto;min-height:100dvh}#vGame{grid-template-columns:1fr;grid-template-rows:auto auto}.grid{overflow:visible}.cols2{grid-template-columns:1fr}.rank{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="head">
    <span id="tn" class="tn">벽란도 무역항</span><span id="pct" class="pct" hidden></span>
    <div class="mid"><span id="badge" class="badge">점검 모드</span><span id="pill" class="pill">준비</span><span id="clock" class="clock">--:--</span><button id="chg" class="chg">다시 접속</button></div>
  </header>

  <section id="vPick" class="view center on"><div>
    <h2 class="big" id="pickTitle"><span class="spin"></span>모둠 자리를 받는 중…</h2>
    <div id="pickMsg" class="waitbox">잠깐만요, 빈 자리를 찾고 있어요</div>
  </div></section>

  <section id="vGame" class="view">
    <div class="col">
      <div class="box order" style="flex:1.1"><h3>📜 주문서 <small id="orderSub">구해 와야 할 물건</small></h3><div id="order" class="grid"></div></div>
      <div class="box inv" style="flex:1"><h3>📦 우리 창고 <small>빨간 딱지 = 주문서에 쓸 몫</small></h3><div id="inv" class="grid"></div></div>
    </div>
    <div class="col">
      <button id="proposeBtn" class="bigbtn">🤝 거래 제안하기<small>말로 약속한 다음에 눌러요</small></button>
      <div id="closedMsg" class="closed" hidden></div>
      <div id="outBox" class="box out" hidden></div>
      <div id="arabBox" class="box arab" hidden><h3>⛵ 아라비아 상선 창구 <small id="arabSub">선착순 · 수량 한정</small></h3><div id="abuy" class="abuy"></div></div>
      <div class="box" style="flex:1"><h3>🧾 우리 거래 <small id="logSub"></small></h3><div id="mylog" class="mylog"></div></div>
    </div>
  </section>

  <section id="vEnd" class="view"><div class="endcard">
    <h2 class="big">무역 끝!</h2>
    <div id="endMine" style="text-align:center"></div>
    <div id="endBonus" class="bonus"></div>
    <div id="endRank" class="rank"></div>
  </div></section>
</div>

<div id="ovCompose" class="ov"><div class="sheet">
  <header><h3>🤝 누구와 거래할까요?</h3><button class="sm" id="cmpClose">닫기 ✕</button></header>
  <div id="partners" class="partners"></div>
  <div class="cols2">
    <div class="side give"><h4>우리가 줄 것 ⬆</h4><div id="giveRows" class="rows"></div></div>
    <div class="side take"><h4>우리가 받을 것 ⬇</h4><div id="takeRows" class="rows"></div></div>
  </div>
  <footer><div id="cmpSum" class="sum"></div><button id="sendBtn" class="send" disabled>제안 보내기 📨</button></footer>
</div></div>

<div id="ovIncoming" class="ov"><div class="modal" id="inModal"></div></div>
<div id="ovEvent" class="ov"><div class="evbox" id="evBox"></div></div>

<canvas id="fx"></canvas>
<div id="toast" class="toast"></div>

<script type="module">
/*
  ══════════════════════════════════════════════════════════════
   벽란도 무역항 · 공용 코드  (board.html / team.html 에 같은 내용이 들어 있음)
  ══════════════════════════════════════════════════════════════
  · Firebase 프로젝트는 낱말 경매장과 같은 open-cbd39 를 씁니다. 데이터 경로만 trade/{ROOM}/... 로 분리.
  · Firestore 보안 규칙은 byeokrando/README.md 참고 (trade 블록 추가 필요).
  · 주소 뒤에 ?demo=1 → 점검 모드(한 컴퓨터의 여러 탭끼리만 통신, 인터넷 불필요).
  · 물건·수량·주문서 등 게임 내용은 board.html 의 DATA 한 곳에서만 고칩니다.
    태블릿(team.html)은 칠판이 Firestore 에 적어 둔 값을 그대로 읽어 씁니다.
*/
const firebaseConfig = Object.freeze({
  apiKey: "AIzaSyD9E86qHToh_f_fNVAcYQldyjCPpARZB-Q",
  authDomain: "open-cbd39.firebaseapp.com",
  projectId: "open-cbd39",
  storageBucket: "open-cbd39.firebasestorage.app",
  messagingSenderId: "322878081506",
  appId: "1:322878081506:web:40efbcf61190f867b451bb"
});
const ROOM = "byeokrando";                 // Firestore 경로: trade/byeokrando/{state|teams|offers|log|npc|waiting}/...
const OFFER_TTL = 180000;                  // 답이 없는 제안은 3분 뒤 화면에서 사라짐(보낸 쪽은 취소 가능)
const FOREIGN_MSG = '외국끼리는 거래할 수 없어요. 벽란도의 고려 상인을 찾아가세요';
const PHASE_LABEL = Object.freeze({ lobby: '준비', r1: '1라운드', event: '아라비아 상선 입항', r2: '2라운드', end: '무역 끝 · 정리' });
const DEFAULT_SCORE = Object.freeze({ done: 20, classBonus: 30 });

const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = v => JSON.parse(JSON.stringify(v ?? null));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newId = p => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

/* ── 게임 규칙 도우미 ── */
const isTradePhase = p => p === 'r1' || p === 'r2';
const isGoryeo = tm => tm?.nation === '고려';
function timeLeft(st, t = Date.now()) { if (!st || !isTradePhase(st.phase)) return null; return st.paused ? (st.left || 0) : (st.endsAt || 0) - t; }
function tradeOpen(st, t = Date.now()) { return !!st && isTradePhase(st.phase) && !st.paused && t < (st.endsAt || 0) + 3000; }   // 3초: 태블릿 시계 오차 완충
function closedReason(st, t = Date.now()) {
  if (!st) return '아직 연결 중이에요';

async function proposeTrade(T, fromId, toId, give, take) {

    const a = await t.get('teams', fromId), b = await t.get('teams', toId), st = await t.get('state', 'main');

    if (!activeIds(st).includes(fromId) || !activeIds(st).includes(toId)) throw new Error('이번 판에 없는 모둠이에요');
    if (!Object.keys(give).length || !Object.keys(take).length) throw new Error('줄 물건과 받을 물건을 모두 담아야 해요');
    if (!tradeOpen(st)) throw new Error(closedReason(st) || '지금은 거래할 수 없어요');
    if (!hasAll(a.inv, give)) throw new Error(`우리 창고에 물건이 모자라요: ${lackText(a.inv, give)}`);
    if (!hasAll(b.inv, take)) throw new Error(`${b.name} 창고에 물건이 모자라요: ${lackText(b.inv, take)}`);

}
/* 수락 = 체결: 제안 확인 → 고려 포함 확인 → 양쪽 재고 확인 → 교환 → 거래 로그 1건. 전부 한 트랜잭션

async function acceptOffer(T, offerId, byId) {
  return T.tx(async t => {
    const o = await t.get('offers', offerId);

    if (o.to !== byId) throw new Error('우리에게 온 제안이 아니에요');
    if (o.status !== 'pending') throw new Error({ accepted: '이미 거래가 끝난 제안이에요', rejected: '이미 거절한 제안이에요', canceled: '상대가 취소한 제안이에요', failed: '이미 실패한 제안이에요' }[o.status] || '받을 수 없는 제안이에요');

    if (!Object.keys(give).length || !Object.keys(take).length) throw new Error('물건이 빈 제안이에요');

      const reason = lackA ? `${a.name} 창고에 이제 물건이 모자라요: ${lackText(a.inv, give)}` : `${b.name} 창고에 이제 물건이 모자라요: ${lackText(b.inv, take)}`;

async function buyArabia(T, teamId, item, pay) {
  return T.tx(async t => {
    const me = await t.get('teams', teamId), npc = await t.get('npc', 'arabia'), st = await t.get('state', 'main');
    if (!me?.nation) throw new Error('모둠 정보를 찾을 수 없어요');
    if (!isGoryeo(me)) throw new Error('아라비아 상선은 벽란도의 고려 상인하고만 거래해요');
    if (!npc || !st?.arabOpen || st.phase !== 'r2') throw new Error('아라비아 상선 창구는 2라운드에 열려요');

    const price = Number(npc.price?.[pay]) || 0;
    if (!price) throw new Error(`아라비아 상인은 ${pay}을(를) 받지 않아요`);
    if ((Number(npc.stock?.[item]) || 0) <= 0) throw new Error(`${item}은(는) 다 팔렸어요`);

    t.update('npc', 'arabia', { stock: { [item]: npc.stock[item] - 1 }, got: { [pay]: (Number(npc.got?.[pay]) || 0) + price } });

    t.set('log', logId, { id: logId, kind: 'arabia', round: 2, from: teamId, to: '아라비아', fromNation: '고려', toNation: '아라비아', give: { [pay]: price }, take: { [item]: 1 }, ts: now });

  el.textContent = mmss(ms);
  if (st.paused || ms <= 0) el.classList.add('off'); else if (ms <= 30000) el.classList.add('hot');
  const open = tradeOpen(st), btn = $('proposeBtn');
  if (me && $('vGame').classList.contains('on') && btn.disabled === open) render();
}
setInterval(tick, 500);
setInterval(() => { if (incomingList().length || myTeam()?.outOffer) render(); }, 5000);   // 오래된 제안 정리

/* ── 연결 ── */
window.addEventListener('db-error', () => { $('badge').textContent = '연결 오류'; $('badge').className = 'badge err on'; });
try {
  T = await createTransport(); if (T.demo) { $('badge').classList.add('on'); window.__game = { T, C, get me() { return me; }, proposeTrade, acceptOffer, closeOffer, buyArabia }; }
  T.watch('state', map => { C.state = map.main || null; render(); clearTimeout(claimTimer); claimTimer = setTimeout(ensureSeat, me || ownsSeat() ? 0 : 200 + Math.random() * 800); });
  T.watch('teams', map => { C.teams = map; render(); clearTimeout(claimTimer); claimTimer = setTimeout(ensureSeat, me || ownsSeat() ? 0 : 300 + Math.random() * 1200); });   // 자리 확인(대기 중이면 무작위 지연 후 재시도)
  T.watch('offers', map => { C.offers = map; render(); });
  T.watch('log', map => { C.log = map; render(); });
  T.watch('npc', map => { C.npc = map; render(); });
  heartbeat();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { heartbeat(); render(); } });
} catch (e) { console.error(e); $('badge').textContent = '연결하지 못했어요 · 새로고침'; $('badge').className = 'badge err on'; }
render();
</script>
</body>
