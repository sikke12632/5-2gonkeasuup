<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낱말 경매장 · 바로가기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1F6;--ink:#1E2A38;--muted:#5B6B7C;--panel:#FFF;--warn:#FF6A45;--ok:#2E9E6B;--line:#D6DFE7;--sky:#3E9BE0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;padding:24px}
main{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
h1{font:clamp(40px,6vw,72px)/1.1 "Jua",sans-serif}h1 span{color:var(--warn)}
p{color:var(--muted);font-size:clamp(16px,2vw,22px)}
.links{display:grid;gap:14px;width:min(560px,100%)}
a{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:22px;padding:18px 22px;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line);border-left:10px solid var(--c)}
a b{font:clamp(24px,3vw,32px) "Jua",sans-serif;color:var(--c)}a small{color:var(--muted);font-size:16px;margin-left:auto;text-align:right}
</style>
</head>
<body>
<main>
  <h1>낱말 <span>경매장</span></h1>
  <p>5학년 2학기 국어 · 문장 성분의 호응 관계 · 공개수업 9/16</p>
  <div class="links">
    <a href="board.html" style="--c:var(--warn)"><b>board</b><small>전자칠판 · 교사 조작</small></a>
    <a href="team.html" style="--c:var(--sky)"><b>team</b><small>모둠 태블릿 · 모둠 번호 선택</small></a>
    <a href="rules.html" style="--c:var(--ok)"><b>rules</b><small>아이들에게 규칙 설명</small></a>
  </div>
</main>
</body>
</html>
