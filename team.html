<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>낱말 경매장 · 모둠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF1F6;--ink:#1E2A38;--muted:#5B6B7C;--panel:#FFF;--warn:#FF6A45;--ok:#2E9E6B;--line:#D6DFE7;--yellow:#FFD75E;--coin:#F5B301;--sky:#3E9BE0;--grape:#9B6BE0;--tc:#888}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--tc) 18%,transparent) 0,transparent 45%),var(--bg)}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit;touch-action:manipulation}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 14px 12px}
.head{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:20px;padding:8px 14px;box-shadow:0 3px 0 var(--line);border-left:12px solid var(--tc);min-height:74px}
.head .tn{font:clamp(28px,3.4vw,40px) "Jua",sans-serif;color:var(--tc)}
.head .coins{display:flex;align-items:center;gap:8px;font:clamp(26px,3.2vw,38px)/1 "Jua",sans-serif;color:#9A6B00;font-variant-numeric:tabular-nums;margin-left:4px;transition:.2s}
.head .coins::before{content:"";width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE99A,var(--coin) 60%,#C98F00);box-shadow:0 1px 0 #A87700;flex:none}
.head .coins small{font-size:.5em;color:var(--muted)}
.head .coins.up{animation:coinup .6s}.head .coins.down{animation:coindown .5s}
@keyframes coinup{30%{transform:scale(1.2);color:var(--ok)}}@keyframes coindown{30%{transform:scale(.9);color:var(--warn)}}
.head .mid{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:.3em .9em;font:clamp(16px,1.8vw,21px) "Jua",sans-serif;white-space:nowrap}
.pill.auction{background:var(--warn)}.pill.build{background:var(--ok)}.pill.present{background:var(--sky)}.pill.end{background:var(--grape)}
.clock{font:clamp(30px,3.6vw,44px)/1 "Jua",sans-serif;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center;padding:4px 10px;border-radius:14px;background:#F2F6F9}
.clock.hot{background:var(--warn);color:#fff;animation:pulse .8s infinite}.clock.ext{background:var(--yellow)}
@keyframes pulse{50%{transform:scale(1.06)}}
.chg{font-size:14px;color:var(--muted);text-decoration:underline;padding:6px}
.badge{border-radius:999px;padding:.3em .8em;font-size:13px;background:#FFF3CD;color:#805C00;display:none;white-space:nowrap}.badge.on{display:block}.badge.err{background:#FFE1DB;color:#B64329}
.view{display:none;min-height:0;flex-direction:column;gap:10px}.view.on{display:flex}
.center{align-items:center;justify-content:center;text-align:center;gap:18px}
h2.big{font:clamp(34px,5vw,60px)/1.15 "Jua",sans-serif}h2.big span{color:var(--warn)}
p.sub{font-size:clamp(17px,2vw,23px);color:var(--muted);line-height:1.5}
/* pick */
.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(820px,100%)}
.pickbtn{aspect-ratio:1.4;border-radius:24px;background:var(--panel);font:clamp(30px,4vw,48px) "Jua",sans-serif;color:var(--pc);border:5px solid var(--pc);box-shadow:0 6px 0 var(--pc);transition:.15s}
.pickbtn:active{transform:translateY(5px);box-shadow:none}
/* cards common */
.cardchip{font:clamp(18px,2.1vw,26px)/1 "Jua",sans-serif;padding:.45em .7em;border-radius:14px;background:var(--cbg);color:var(--cdark);border:3px solid var(--cc);white-space:nowrap;transition:.2s}
.cardchip.used{opacity:.4;text-decoration:line-through}
.cardchip.pop{animation:popin .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:none;opacity:1}}
.mycards{background:rgba(255,255,255,.75);border:3px dashed var(--line);border-radius:18px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mycards h3{font:clamp(16px,1.8vw,20px) "Jua",sans-serif;color:var(--muted);margin-right:4px}
/* auction */
.rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rhead h2{font:clamp(26px,3.4vw,40px)/1 "Jua",sans-serif;color:var(--tcol)}
.rhead span{font-size:clamp(15px,1.7vw,20px);color:var(--muted)}
.agrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:10px;overflow:auto}
.agrid.bonus{grid-template-columns:repeat(4,1fr)}
.acard{position:relative;background:var(--panel);border-radius:20px;border:4px solid var(--cc);box-shadow:0 4px 0 var(--cc);display:flex;flex-direction:column;overflow:hidden;min-height:150px;transition:.25s}
.acard.mine{box-shadow:0 0 0 4px var(--tc),0 4px 0 var(--cc);transform:translateY(-3px)}
.acard.lost{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.acard .type{position:absolute;left:8px;top:6px;font:13px "Jua",sans-serif;color:var(--cdark);background:var(--cbg);padding:2px 8px;border-radius:999px}
.acard .tmr{position:absolute;right:8px;top:6px;font:14px "Jua",sans-serif;color:#fff;background:var(--warn);padding:2px 8px;border-radius:999px;display:none}.acard .tmr.on{display:block;animation:pulse .8s infinite}
.acard .word{flex:1;display:grid;place-items:center;padding:28px 8px 4px;font:clamp(20px,2.6vw,34px)/1.15 "Jua",sans-serif;text-align:center;word-break:keep-all}
.acard .info{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font:clamp(17px,2vw,24px)/1 "Jua",sans-serif;color:#9A6B00;font-variant-numeric:tabular-nums}
.acard .info .who{font-size:.72em;color:#fff;background:var(--bc,#A5B0BA);padding:4px 9px;border-radius:999px}
.acard .info .who.none{background:transparent;color:#A5B0BA}
.acard .info .price.bump{animation:bump .45s}
@keyframes bump{35%{transform:scale(1.3);color:var(--warn)}}
.acard .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--cbg)}
.bid{height:clamp(44px,5.4vh,56px);border-radius:12px;font:clamp(15px,1.7vw,20px) "Jua",sans-serif;color:#fff;background:var(--ink);box-shadow:0 3px 0 #101923;line-height:1.05}
.bid.buy{background:var(--warn);box-shadow:0 3px 0 #C94729}
.bid small{display:block;font-size:.75em;opacity:.85}
.bid:disabled{opacity:.3;box-shadow:none}.bid:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.acard.sold .btns,.acard.unsold .btns{visibility:hidden}
.acard.sold,.acard.unsold{opacity:.85}.acard.unsold{filter:grayscale(.7);opacity:.5}
.stamp{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.acard.sold .stamp,.acard.unsold .stamp{display:grid}
.stamp div{transform:rotate(-12deg);border:4px solid var(--bc,#8A98A6);color:var(--bc,#8A98A6);border-radius:14px;padding:4px 14px;font:clamp(20px,2.4vw,30px)/1.2 "Jua",sans-serif;background:rgba(255,255,255,.9);text-align:center;animation:stampin .5s cubic-bezier(.2,.9,.3,1.35)}
.stamp div small{display:block;font-size:.6em}
@keyframes stampin{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.ext-flash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-6deg);font:clamp(20px,2.6vw,30px) "Jua",sans-serif;color:#fff;background:#D9A800;padding:4px 12px;border-radius:12px;pointer-events:none;animation:flash 1.4s forwards;z-index:3}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-6deg)}80%{opacity:1}100%{opacity:0}}
/* closed */
.gotlist{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* build */
.build{gap:10px}
.tray{background:var(--panel);border-radius:22px;padding:12px 14px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{min-height:clamp(78px,11vh,104px);border-radius:16px;border:3px dashed var(--cc);background:color-mix(in srgb,var(--cbg) 60%,#fff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;transition:.2s}
.slot .lab{font:14px "Jua",sans-serif;color:var(--cdark);opacity:.8}
.slot .lab small{font-family:"Gowun Dodum";color:var(--muted);margin-left:4px}
.slot.filled{border-style:solid;background:var(--cbg)}
.slot .cardchip{font-size:clamp(20px,2.4vw,30px)}
.slot.opt .lab::after{content:" (선택)";font-size:.85em;opacity:.7}
.tray .row{display:flex;align-items:center;gap:10px}
.preview{flex:1;font:clamp(22px,2.8vw,34px)/1.2 "Jua",sans-serif;min-height:1.2em;color:var(--ink)}
.preview .ph{color:#A5B0BA}
.submit{height:clamp(50px,6.5vh,64px);padding:0 22px;border-radius:16px;background:var(--ok);color:#fff;font:clamp(19px,2.2vw,26px) "Jua",sans-serif;box-shadow:0 4px 0 #1F7A50;white-space:nowrap}
.submit:disabled{opacity:.35;box-shadow:none}.submit:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.submit small{font-size:.7em;opacity:.9;margin-left:4px}
.hand{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.hand-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.6);border-radius:16px;padding:8px 10px}
.hand-row h3{font:clamp(15px,1.7vw,19px) "Jua",sans-serif;color:var(--cdark);background:var(--cbg);border:2px solid var(--cc);border-radius:999px;padding:3px 10px;margin-right:2px}
.hand-row .none{color:#A5B0BA;font-size:16px}
.hcard{font:clamp(19px,2.3vw,28px)/1 "Jua",sans-serif;padding:.5em .75em;border-radius:14px;background:var(--panel);color:var(--cdark);border:3px solid var(--cc);box-shadow:0 3px 0 var(--cc);transition:.15s}
.hcard:active{transform:translateY(3px);box-shadow:none}
.hcard.intray{opacity:.35;box-shadow:none;transform:scale(.92)}
.done-list{display:flex;flex-direction:column;gap:6px}
.dsent{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:8px 10px;box-shadow:0 2px 0 var(--line)}
.dsent .txt{flex:1;font:clamp(18px,2.2vw,26px)/1.2 "Jua",sans-serif;display:flex;gap:6px;flex-wrap:wrap}
.dsent .txt span{padding:2px 8px;border-radius:8px;background:var(--cbg);color:var(--cdark)}
.dsent .pts{font:clamp(17px,2vw,22px) "Jua",sans-serif;background:var(--ok);color:#fff;border-radius:10px;padding:4px 10px;white-space:nowrap}
.dsent.rejected .pts{background:#8A98A6}.dsent.rejected .txt{text-decoration:line-through;opacity:.6}
.dsent .del{font-size:14px;color:var(--muted);padding:6px 8px;border-radius:8px;background:#F2F6F9}
/* present */
.pres-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pres-head h2{font:clamp(26px,3.6vw,42px)/1 "Jua",sans-serif;color:var(--pc)}
.pres-head .objleft{margin-left:auto;font:clamp(16px,1.9vw,21px) "Jua",sans-serif;color:var(--muted)}
.pres-head .objleft i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}.pres-head .objleft i.off{background:#DDE4EA}
.plist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.psent{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--line);border:4px solid transparent;transition:.2s}
.psent.sel{border-color:var(--warn);background:#FFF6F3}
.psent.pending{border-color:var(--warn);animation:shake .5s}.psent.rejected{opacity:.55}.psent.rejected .txt{text-decoration:line-through}
.psent .no{font:22px "Jua",sans-serif;color:var(--muted);width:30px;text-align:center}
.psent .txt{flex:1;display:flex;gap:6px;flex-wrap:wrap}
.psent .txt span{font:clamp(20px,2.6vw,32px)/1.15 "Jua",sans-serif;padding:4px 10px;border-radius:10px;background:var(--cbg);color:var(--cdark);border:2px solid var(--cc)}
.psent .st{font:15px "Jua",sans-serif;color:#fff;background:var(--warn);padding:3px 10px;border-radius:999px;white-space:nowrap}
.psent .st.dis{background:#8A98A6}.psent .st.acc{background:var(--ink)}
.objbar{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:10px 14px;box-shadow:0 3px 0 var(--line)}
.objbar p{flex:1;font-size:clamp(16px,1.9vw,21px);color:var(--muted);line-height:1.4}
.objbar.raised{background:#FFF6F3;border:3px solid var(--warn)}
.objbar.speak{background:var(--warn);color:#fff;animation:pulse .9s infinite}.objbar.speak p{color:#fff;font:clamp(22px,2.8vw,32px) "Jua",sans-serif}
.objbar .timer{font:clamp(30px,4vw,48px)/1 "Jua",sans-serif;font-variant-numeric:tabular-nums;color:#fff;background:rgba(0,0,0,.18);border-radius:14px;padding:6px 14px}
.confirm{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(30,42,56,.55)}
.confirm.on{display:grid}
.confirm .box{background:#fff;border-radius:28px;padding:28px 32px;width:min(560px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:popin .3s}
.confirm h3{font:clamp(28px,4vw,40px)/1.2 "Jua",sans-serif;margin-bottom:8px}
.confirm p{color:var(--muted);font-size:clamp(16px,2vw,21px);line-height:1.5;margin-bottom:18px}
.confirm .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.confirm .btns button{height:clamp(56px,8vh,72px);border-radius:16px;font:clamp(20px,2.6vw,28px) "Jua",sans-serif}
.confirm .yes{background:var(--warn);color:#fff;box-shadow:0 4px 0 #C94729}.confirm .no{background:#EDF2F6;color:var(--ink)}
.objbtn{height:clamp(58px,8vh,76px);padding:0 30px;border-radius:18px;background:var(--warn);color:#fff;font:clamp(22px,2.6vw,30px) "Jua",sans-serif;box-shadow:0 4px 0 #C94729;white-space:nowrap}
.objbtn:disabled{opacity:.35;box-shadow:none}.objbtn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.mine-banner{background:var(--panel);border-radius:22px;padding:22px;text-align:center;font:clamp(24px,3.2vw,38px) "Jua",sans-serif;color:var(--tc);box-shadow:0 3px 0 var(--line)}
/* end */
.rank{display:flex;flex-direction:column;gap:8px;width:min(620px,100%)}
.rank div{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:10px 16px;font:clamp(20px,2.6vw,30px) "Jua",sans-serif;color:var(--pc);box-shadow:0 2px 0 var(--line)}
.rank div.me{border:4px solid var(--pc);transform:scale(1.03)}
.rank div b{margin-left:auto;color:var(--ink)}
.toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-30px);background:var(--ink);color:#fff;border-radius:999px;padding:.6em 1.3em;font-size:clamp(16px,2vw,21px);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:92vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#B64329}.toast.win{background:var(--ok)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media(max-width:760px){.agrid{grid-template-columns:repeat(2,1fr)}.agrid.bonus{grid-template-columns:repeat(2,1fr)}.pick-grid{grid-template-columns:repeat(2,1fr)}.slots{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px) and (min-width:761px){.agrid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header class="head">
    <span id="tn" class="tn">?모둠</span>
    <span id="coins" class="coins">5,000<small>코인</small></span>
    <div class="mid"><span id="badge" class="badge">점검 모드</span><span id="pill" class="pill">준비</span><span id="clock" class="clock">--:--</span><button id="chg" class="chg">모둠 바꾸기</button></div>
  </header>

  <section id="vPick" class="view center on">
    <h2 class="big">우리는 <span>몇 모둠</span>인가요?</h2>
    <div id="pickGrid" class="pick-grid"></div>
    <p class="sub">한 번 고르면 이 태블릿이 기억해요</p>
  </section>

  <section id="vLobby" class="view center">
    <h2 class="big" id="lobbyTitle">준비 중이에요</h2>
    <p class="sub" id="lobbySub">기본 카드 3장으로 이미 문장 하나가 만들어져 있어요</p>
    <div id="lobbyCards" class="gotlist"></div>
    <p class="sub" id="lobbyHint">예산 <b>5,000코인</b> · 시작가 300 · 한 번에 +100 · 즉시구매 1,500</p>
  </section>

  <section id="vAuction" class="view">
    <div class="rhead"><h2 id="rTitle"></h2><span id="rDesc"></span><span style="margin-left:auto">마지막 10초에 누가 지르면 <b>10초 연장</b></span></div>
    <div id="agrid" class="agrid"></div>
    <div id="myCardsA" class="mycards"></div>
  </section>

  <section id="vClosed" class="view center">
    <h2 class="big" id="cTitle">라운드 끝!</h2>
    <p class="sub" id="cSub"></p>
    <div id="gotList" class="gotlist"></div>
    <div id="myCardsC" class="mycards" style="width:min(900px,100%)"></div>
  </section>

  <section id="vBuild" class="view build">
    <div class="tray">
      <div id="slots" class="slots"></div>
      <div class="row"><div id="preview" class="preview"><span class="ph">카드를 눌러 문장을 만들어요</span></div><button id="submitBtn" class="submit" disabled><span id="submitLabel">문장 완성!</span><small id="ptsHint"></small></button></div>
    </div>
    <div id="hand" class="hand"></div>
  </section>

  <section id="vPresent" class="view">
    <div class="pres-head"><h2 id="pTeam"></h2><span class="sub" id="pSub"></span><span class="objleft" id="objLeft"></span></div>
    <div id="plist" class="plist"></div>
    <div id="objbar" class="objbar"><p id="objMsg"></p><span id="objTimer" class="timer" hidden>30</span><button id="objBtn" class="objbtn" disabled>✋ 이의!</button></div>
  </section>

  <section id="vEnd" class="view center">
    <h2 class="big">최종 <span>결과</span></h2>
    <div id="rank" class="rank"></div>
  </section>
</div>
<canvas id="fx"></canvas>
<div id="toast" class="toast"></div>
<div id="confirmObj" class="confirm"><div class="box"><h3>정말로 이의를 제기할까요?</h3><p id="confirmMsg"></p><div class="btns"><button class="no" id="confirmNo">아니요</button><button class="yes" id="confirmYes">네, 손 들기! ✋</button></div></div></div>

<script type="module">
/*
  ══════════════════════════════════════════════════════════════
   낱말 경매 · 공용 설정  (board.html / team.html 에 같은 내용이 들어 있음)
  ══════════════════════════════════════════════════════════════
  ── 수업 전 교사가 할 일 (Firebase 콘솔, 이 순서대로) ──
  1. 새 프로젝트 생성  (이 수업 전용. 기존 프로젝트 재사용 X)
  2. 빌드 > Firestore Database > 데이터베이스 만들기
       · 위치: asia-northeast3 (서울)   · 프로덕션 모드
  3. Firestore > 규칙 탭에 아래를 그대로 붙여넣고 [게시]
       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /auction/s0916/{document=**} {
             allow read, write: if request.time < timestamp.date(2026, 9, 17);
           }

/* ── 통신 계층: Firestore 또는 점검 모드(같은 컴퓨터의 탭끼리) ──

function mockTransport() {

    update: (col, id, patch) => { const c = colName(prefix, col); (d[c] ??= {})[id] = deepMerge(d[c][id] || {}, patch); },
    del: (col, id) => { const c = colName(prefix, col); if (d[c]) delete d[c][id]; }

    async tx(fn) { const d = load(); const r = await fn(ops(d)); save(d); return r; },

async function firestoreTransport() {
  const appMod = await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');

  let prefix = '';
  const ref = (col, id) => fs.doc(db, 'auction', ROOM, colName(prefix, col), id);
  const clean = v => clone(v);                         // undefined 제거
  const writer = tx => ({
    set: (col, id, data) => tx.set(ref(col, id), clean(data)),
    update: (col, id, patch) => tx.set(ref(col, id), clean(patch), { merge: true }),
    del: (col, id) => tx.delete(ref(col, id))
  });
  return {
    demo: false, setPrefix(p) { prefix = p; },
    watch(col, cb) {
      const map = {};
      return fs.onSnapshot(fs.collection(db, 'auction', ROOM, colName(prefix, col)), snap => {
        snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete map[ch.doc.id]; else map[ch.doc.id] = ch.doc.data(); });
        cb({ ...map });
      }, err => { console.error(err); window.dispatchEvent(new CustomEvent('db-error', { detail: err })); });
    },
    async tx(fn) {
      return fs.runTransaction(db, async tx => fn({
        get: async (col, id) => { const s = await tx.get(ref(col, id)); return s.exists() ? s.data() : null; },
        ...writer(tx)
      }));
    },
    async batch(list) {
      for (let i = 0; i < list.length; i += 450) {          // Firestore 일괄 쓰기 한도 500
        const b = fs.writeBatch(db), w = writer(b);
        list.slice(i, i + 450).forEach(x => w[x.op](x.col, x.id, x.data));
        await b.commit();
      }
    }
  };
}

/* 입찰: 현재가 확인 → 잔액 확인 → 기록을 한 트랜잭션에서. buyNow=true 면 즉시구매 */
async function placeBid(T, teamId, cardId, buyNow = false) {
  return T.tx(async t => {
    const card = await t.get('cards', cardId);
    if (!card) throw new Error('카드를 찾을 수 없어요');
    if (card.status !== 'open') throw new Error('이미 마감된 카드예요');
    const me = await t.get('teams', teamId);
    if (!me) throw new Error('모둠 정보를 찾을 수 없어요');
    const prevBidder = card.bidder && card.bidder !== teamId ? card.bidder : null;
    const prev = prevBidder ? await t.get('teams', prevBidder) : null;
    const now = Date.now();
    if (!buyNow && card.bidder === teamId) throw new Error('지금 우리 모둠이 최고가예요');
    let price = buyNow ? RULE.buyout : (card.bidder ? Number(card.price) + RULE.step : RULE.start);
    const myHeld = card.bidder === teamId ? Number(card.price) : 0;          // 이 카드에 이미 걸어 둔 코인
    const available = Number(me.budget) + myHeld;
    if (available < price) throw new Error(`코인이 부족해요 (잔액 ${fmt(me.budget)})`);
    const sold = buyNow || price >= RULE.buyout;
    if (sold) price = RULE.buyout;
    const before = card.endsAt || now;
    let endsAt = before, extended = card.extended || 0;
    if (!sold && endsAt - now <= RULE.softClose) { endsAt = Math.max(endsAt, now) + RULE.softClose; extended++; }
    t.update('cards', cardId, { price, bidder: teamId, bids: (card.bids || 0) + 1, endsAt, extended, lastBidAt: now,
      ...(sold ? { status: 'sold', team: teamId, closedAt: now, buyNow: !!buyNow } : {}) });
    t.update('teams', teamId, { budget: available - price });
    if (prev) t.update('teams', prevBidder, { budget: Number(prev.budget) + Number(card.price) });
    return { price, sold, extended: endsAt !== before };
  });
}

    const cards = [];
    for (const cid of cardIds) {
      const c = await t.get('cards', cid);
      if (!c || c.team !== teamId) throw new Error('우리 모둠 카드가 아니에요');
      if (c.usedIn) throw new Error(`"${c.text}" 카드는 이미 다른 ${DECK.unit}에 썼어요`);

    if (p.status !== 'sold' && c.status === 'sold' && c.team === me) { toast(`"${c.text}" 낙찰! 우리 카드예요 🎉`, 'win'); beep('win'); confetti(innerWidth / 2, innerHeight * .35, 50, [teamColor(me), '#FFD75E', '#fff']); }
  });
}
/* ── 입찰 ── */
$('agrid').addEventListener('click', async e => {
  const b = e.target.closest('.bid'); if (!b || b.disabled) return; const id = b.dataset.id, buy = b.classList.contains('buy');
  if (buy && !confirm(`"${C.cards[id]?.text}" 를 1,500코인에 바로 살까요?`)) return;
  b.disabled = true;
  try { const r = await placeBid(T, me, id, buy); beep('tap'); if (r.sold) toast(`"${C.cards[id]?.text}" 즉시구매! 우리 카드예요`, 'win'); else if (r.extended) toast(`${fmt(r.price)}코인으로 최고가! 마감이 10초 늘어났어요`); }
  catch (err) { toast(err.message, 'err'); render(); }
});
/* ── 타이머 ── */
function tick() {
  const st = S(), clock = $('clock'); let ms = null, ext = false;
  if (st?.phase === 'auction' && st.roundStatus === 'bidding') { const open = roundCards(st.round).filter(c => c.status === 'open'); const dl = open.length ? Math.max(...open.map(c => c.endsAt || 0)) : st.roundEndsAt; ms = dl - now(); ext = dl > st.roundEndsAt; roundCards(st.round).forEach(c => { const el = $('agrid').querySelector(`[data-id="${c.id}"] .tmr`); if (!el) return; const left = (c.endsAt || 0) - now(); const show = c.status === 'open' && left <= 15000; el.classList.toggle('on', show); el.textContent = show ? `⏱ ${Math.max(0, Math.ceil(left / 1000))}` : ''; }); }
  if (st?.phase === 'build') ms = st.buildEndsAt - now();
  if (st?.phase === 'present' && currentTeam()) { const sp = st.present.speaker && raisedTeams(st).includes(st.present.speaker); ms = (sp ? st.present.focusEndsAt || 0 : st.present.teamEndsAt || 0) - now(); if (sp && st.present.speaker === me) $('objTimer').textContent = Math.max(0, Math.ceil(ms / 1000)); }
  clock.textContent = ms === null ? '--:--' : mmss(ms); clock.classList.toggle('hot', ms !== null && ms <= 10000 && ms > -1000); clock.classList.toggle('ext', ext && ms > 0);
}
setInterval(tick, 250);

/* ── 연결 ── */
window.addEventListener('db-error', () => { $('badge').textContent = '연결 오류'; $('badge').className = 'badge err on'; });
try {
  T = await createTransport(); if (T.demo) $('badge').classList.add('on');
  applyDeckText(); bindDeck(deck.id);
  T.watch('meta', map => { const id = map.active?.deck; if (id && DECKS[id] && id !== deck.id) { bindDeck(id); toast(`${deck.title}으로 바뀌었어요`); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) heartbeat(); });
} catch (e) { console.error(e); $('badge').textContent = '연결하지 못했어요 · 새로고침'; $('badge').className = 'badge err on'; }
render();
</script>
</body>
